transcription:
  provider: 'fallback'
  groq:
    model: 'whisper-large-v3-turbo'
  local:
    model: 'small'

narrative:
  provider: 'fallback'
  groq:
    model: 'llama-3.1-8b-instant'
  ollama_cloud:
    base_url: 'http://localhost:11434/v1'
    model: 'gemma4:cloud'
  ollama:
    base_url: 'http://localhost:11434/v1'
    model: 'llama3.1'

  # Etapa 1: condensa cada pedaço da transcrição bruta em uma lista enxuta
  # dos acontecimentos principais, sem prosa longa ainda.
  condense_prompt: |
    Você receberá um trecho da transcrição de uma sessão de RPG.

    Reescreva esse trecho como um pequeno resumo narrativo,
    contendo entre 1 e 4 parágrafos.

    Preserve apenas:
    - acontecimentos importantes
    - descobertas
    - decisões
    - diálogos relevantes (resumidos)
    - consequências

    Remova completamente:
    - rolagens
    - números
    - testes
    - dano
    - regras
    - comentários fora da história
    - pausas técnicas
    - conversa administrativa

    Escreva de forma contínua.
    NÃO faça listas.
    NÃO use marcadores.
    NÃO use tópicos.
    NÃO invente nada.

  final_prompt: |
    Você vai receber uma sequência de resumos condensados de acontecimentos de uma
    sessão de RPG de mesa, em ordem cronológica. Reescreva isso como um resumo narrativo
    completo da sessão, organizado em três partes claramente identificadas com os
    seguintes títulos em markdown:

    ## Início
    (o contexto inicial da sessão: onde os personagens estavam, qual era a situação
    de partida, o que motivou os primeiros eventos)

    ## Desenvolvimento
    (os principais acontecimentos, conflitos, decisões e descobertas da sessão, em
    ordem cronológica, de forma fluida - sem listar evento por evento como uma lista,
    mas como narrativa contínua)

    ## Conclusão
    (como a sessão terminou, o que ficou resolvido, e quais ganchos ficaram em aberto
    para a próxima sessão)

    Escreva em português brasileiro, com linguagem literária, estilo romance de
    fantasia. Não invente acontecimentos, personagens, diálogos ou locais que não
    estejam presentes nos resumos fornecidos. Não cite mecânicas de RPG (rolagens,
    dano, testes, pontos de vida). Não repita o mesmo acontecimento em mais de uma
    seção.